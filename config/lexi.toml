[server]
host = "127.0.0.1"
port = 8765

[actions.say_hello]
description = "Test action that prints a hello response"
command = "printf 'Hello from Lexi'"
triggers = ["hello", "say hello"]

[actions.take_screenshot]
description = "Take a screenshot using your local screenshot command"
command = "printf 'Configure config/lexi.toml with your screenshot script'"
triggers = ["screenshot", "take screenshot"]

[actions.set_wallpaper]
description = "Set the wallpaper using your local wallpaper command"
command = "printf 'Configure config/lexi.toml with your wallpaper script for %s' {path:q}"
triggers = ["set wallpaper", "change wallpaper"]
