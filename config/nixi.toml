[server]
host = "127.0.0.1"
port = 8765

[voice]
wake_phrases = [
  "hey nixi",
  "hey nixie",
  "hey nicki",
  "hey nicky",
  "hey nick see",
  "hey next see",
  "hey next thing",
]
model = "tiny.en"
language = "en"
sample_rate = 16000
speech_threshold = 500
silence_ms = 400
speech_start_ms = 150
min_speech_ms = 250
max_utterance_seconds = 8
command_timeout_seconds = 8
calibration_ms = 1000
adaptive_noise_ratio = 2.5
# Set this to a PipeWire node id or name to override the default microphone.
microphone_target = ""

[llm]
model = "gemini-3.5-flash"
system_prompt = """You are Nixi, a concise and friendly desktop voice assistant.
Answer naturally for speech and avoid Markdown unless asked."""
max_tokens = 1024
thinking_level = "minimal"
timeout_seconds = 30
history_turns = 8
cooldown_seconds = 60

[stt]
enabled = true
model = "saaras:v3-realtime"
language = "auto"
mode = "transcribe"
stream_type = "fast"
threshold = 0.3
silence_ms = 500
min_speech_ms = 250
timeout_seconds = 15

[tts]
enabled = true
model = "bulbul:v3"
language = "en-IN"
speaker = "shubh"
pace = 1.05
sample_rate = 24000
temperature = 0.6
timeout_seconds = 30

[actions.say_hello]
description = "Test action that prints a hello response"
command = "printf 'Hello from Nixi'"
triggers = ["hello", "say hello"]

[actions.take_screenshot]
description = "Take a screenshot using your local screenshot command"
command = "printf 'Configure config/nixi.toml with your screenshot script'"
triggers = ["screenshot", "take screenshot"]

[actions.set_wallpaper]
description = "Set the wallpaper using your local wallpaper command"
command = "printf 'Configure config/nixi.toml with your wallpaper script for %s' {path:q}"
triggers = ["set wallpaper", "change wallpaper"]
