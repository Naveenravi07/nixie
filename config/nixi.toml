[server]
host = "127.0.0.1"
port = 8765

[voice]
wake_phrases = [
  "hey nixi",
  "hey nixie",
  "hey nicki",
  "hey nicky",
  "hey nick see",
  "hey next see",
  "hey next thing",
]
model = "tiny.en"
language = "en"
sample_rate = 16000
speech_threshold = 500
silence_ms = 400
speech_start_ms = 150
min_speech_ms = 250
max_utterance_seconds = 8
command_timeout_seconds = 8
calibration_ms = 1000
adaptive_noise_ratio = 2.5
# While Nixi is speaking, require louder, sustained speech before interrupting.
barge_in_threshold_multiplier = 1.6
barge_in_speech_start_ms = 200
# Set this to a PipeWire node id or name to override the default microphone.
microphone_target = ""

[llm]
model = "gemini-3.5-flash-lite"
system_prompt = """You are Nixi, a concise and friendly desktop voice assistant.
Answer naturally for speech and avoid Markdown unless asked."""
max_tokens = 1024
thinking_level = "minimal"
timeout_seconds = 30
history_turns = 8
# Allow Vertex AI to ground time-sensitive questions with Google Search.
google_search_enabled = true

[stt]
enabled = true
model = "saaras:v3-realtime"
language = "en-IN"
mode = "transcribe"
stream_type = "fast"
threshold = 0.3
silence_ms = 500
min_speech_ms = 250
timeout_seconds = 15

[tts]
enabled = true
model = "bulbul:v3"
language = "en-IN"
speaker = "shubh"
pace = 1.05
sample_rate = 24000
temperature = 0.6
timeout_seconds = 30

# --- auto-generated by `nixi-server --discover` --- do not edit below this line ---

[actions.set_wallpaper]
# source: /home/shastri/.local/bin/setwall
description = "Sets the desktop wallpaper. The path argument is optional — if the user does not mention a specific file or image name, leave path empty and the system will automatically pick a random image from ~/Pictures. Only set path if the user explicitly names a file or describes a specific image."
command = "/home/shastri/.local/bin/setwall {path}"

[actions.take_screenshot]
# source: extracted from hyprland config by LLM
description = "Takes a screenshot of a selected screen area using grim, slurp, and satty for editing, then copies the result to the clipboard."
command = "tmp=$(mktemp --suffix=.png) && grim -g \"$(slurp)\" \"$tmp\" && satty --filename \"$tmp\" --output-filename \"$tmp\" && wl-copy < \"$tmp\" && rm \"$tmp\""

[actions.volume_up]
# source: extracted from hyprland config by LLM
description = "Raises the audio volume using wpctl (PipeWire). The amount arg must be a percentage string with a plus sign, e.g. '5%+' or '10%+'. Default to '5%+' if no amount is given."
command = "wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ {amount}"

[actions.volume_down]
# source: extracted from hyprland config by LLM
description = "Lowers the audio volume using wpctl (PipeWire). The amount arg must be a percentage string with a minus sign, e.g. '5%-' or '10%-'. Default to '5%-' if no amount is given."
command = "wpctl set-volume @DEFAULT_AUDIO_SINK@ {amount}"

[actions.mute_audio]
# source: extracted from hyprland config by LLM
description = "Toggles audio mute state for the default audio sink using wpctl."
command = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"

[actions.open_launcher]
# source: extracted from hyprland config by LLM
description = "Opens the application launcher menu using hyprlauncher."
command = "hyprlauncher"

[actions.media_play_pause]
# source: extracted from hyprland config by LLM
description = "Toggles media playback (play or pause) using playerctl."
command = "playerctl play-pause"

[actions.media_next]
# source: extracted from hyprland config by LLM
description = "Skips to the next media track using playerctl."
command = "playerctl next"

[actions.media_prev]
# source: extracted from hyprland config by LLM
description = "Goes to the previous media track using playerctl."
command = "playerctl previous"

[actions.brightness_up]
# source: extracted from hyprland config by LLM
description = "Increases screen backlight brightness using brightnessctl. The amount arg must be a percentage string with a plus sign, e.g. '5%+' or '10%+'. Default to '5%+' if not specified."
command = "brightnessctl -e4 -n2 set {amount}"

[actions.brightness_down]
# source: extracted from hyprland config by LLM
description = "Decreases screen backlight brightness using brightnessctl. The amount arg must be a percentage string with a minus sign, e.g. '5%-' or '10%-'. Default to '5%-' if not specified."
command = "brightnessctl -e4 -n2 set {amount}"

