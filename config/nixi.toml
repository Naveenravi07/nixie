[server]
host = "127.0.0.1"
port = 8765

[voice]
sample_rate = 16000
command_timeout_seconds = 8
# Set this to a PipeWire node id or name to override the default microphone.
microphone_target = ""

[llm]
model = "gemini-3.5-flash-lite"
system_prompt = """You are Nixi, a concise and friendly desktop voice assistant.
Answer naturally for speech and avoid Markdown unless asked.

You have access to tools on the user's Linux computer:

1. **run_command** — Execute any read-only shell command and see its output.
   Use this proactively to answer questions about the system, check configurations,
   open applications (e.g. "firefox", "code"), open URLs (e.g. "open https://twitter.com"),
   list files, check memory/cpu/disk usage, or gather any information.
   Examples: free -h, df -h, ls ~/Documents, top -bn1 | head -20, xdg-open https://example.com

2. **Pre-configured actions** — volume_up, volume_down, mute_audio, set_wallpaper,
   brightness_up, brightness_down, take_screenshot, media_play_pause, media_next, media_prev.
   Use these for specific media/brightness/wallpaper actions.

Rules:
- Always use run_command for system queries, opening apps, or opening websites.
- Use the pre-configured actions for volume/brightness/media/wallpaper controls.
- Be concise in your spoken responses (1-3 sentences max).
- If a command fails, explain what went wrong briefly."""
max_tokens = 1024
thinking_level = "minimal"
timeout_seconds = 30
history_turns = 8
# Allow Vertex AI to ground time-sensitive questions with Google Search.
google_search_enabled = true

[stt]
enabled = true
model = "saaras:v3-realtime"
language = "en-IN"
mode = "transcribe"
stream_type = "fast"
threshold = 0.3
silence_ms = 500
min_speech_ms = 250
timeout_seconds = 15

[tts]
enabled = true
model = "bulbul:v3"
language = "en-IN"
speaker = "shubh"
pace = 1.05
sample_rate = 24000
temperature = 0.6
timeout_seconds = 30

# --- auto-generated by `nixi-server --discover` --- do not edit below this line ---

[actions.set_wallpaper]
# source: /home/shastri/.local/bin/setwall
description = "Sets the desktop wallpaper. The path argument is optional — if the user does not mention a specific file or image name, leave path empty and the system will automatically pick a random image from ~/Pictures. Only set path if the user explicitly names a file or describes a specific image."
command = "/home/shastri/.local/bin/setwall {path}"

[actions.take_screenshot]
# source: extracted from hyprland config by LLM
description = "Captures a selected screen area using grim and slurp, opens it in satty for annotation, copies the result to clipboard with wl-copy, and cleans up the temp file."
command = "tmp=$(mktemp --suffix=.png) && grim -g \"$(slurp)\" \"$tmp\" && satty --filename \"$tmp\" --output-filename \"$tmp\" && wl-copy < \"$tmp\" && rm \"$tmp\""

[actions.volume_up]
# source: extracted from hyprland config by LLM
description = "Raises system volume using wpctl (PipeWire). The amount arg must be a percentage string with a plus sign, e.g. '5%+' or '10%+'. Default to '5%+' if user does not specify an amount."
command = "wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ {amount}"

[actions.volume_down]
# source: extracted from hyprland config by LLM
description = "Lowers system volume using wpctl (PipeWire). The amount arg must be a percentage string with a minus sign, e.g. '5%-' or '10%-'. Default to '5%-' if user does not specify an amount."
command = "wpctl set-volume @DEFAULT_AUDIO_SINK@ {amount}"

[actions.mute_audio]
# source: extracted from hyprland config by LLM
description = "Toggles audio mute state for the default audio sink using wpctl."
command = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"

[actions.open_launcher]
# source: extracted from hyprland config by LLM
description = "Opens the wofi application launcher in drun mode."
command = "wofi --show drun"

[actions.media_play_pause]
# source: extracted from hyprland config by LLM
description = "Toggles media playback (play/pause) using playerctl."
command = "playerctl play-pause"

[actions.media_next]
# source: extracted from hyprland config by LLM
description = "Skips to the next media track using playerctl."
command = "playerctl next"

[actions.media_prev]
# source: extracted from hyprland config by LLM
description = "Skips to the previous media track using playerctl."
command = "playerctl previous"

[actions.brightness_up]
# source: extracted from hyprland config by LLM
description = "Increases screen brightness using brightnessctl. The amount arg must be a percentage string with a plus sign, e.g. '5%+'. Default to '5%+' if user does not specify an amount."
command = "brightnessctl -e4 -n2 set {amount}"

[actions.brightness_down]
# source: extracted from hyprland config by LLM
description = "Decreases screen brightness using brightnessctl. The amount arg must be a percentage string with a minus sign, e.g. '5%-'. Default to '5%-' if user does not specify an amount."
command = "brightnessctl -e4 -n2 set {amount}"

# --- end auto-generated ---
