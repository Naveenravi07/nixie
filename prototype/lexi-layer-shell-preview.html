<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lexi Layer Shell Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111318;
        --panel: rgba(22, 24, 31, 0.88);
        --panel-strong: rgba(30, 33, 42, 0.96);
        --line: rgba(255, 255, 255, 0.13);
        --text: #f5f2eb;
        --muted: #b8b5ad;
        --accent: #65d6c8;
        --hot: #f2b35e;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 12% 12%, rgba(101, 214, 200, 0.16), transparent 28%),
          linear-gradient(135deg, #14171f 0%, #1f2027 45%, #13161c 100%);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .desktop {
        position: relative;
        min-height: 100vh;
        padding: 22px;
      }

      .topbar,
      .window,
      .dock {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.045);
        backdrop-filter: blur(18px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 42px;
        padding: 0 16px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .workarea {
        display: grid;
        grid-template-columns: minmax(220px, 0.65fr) minmax(320px, 1fr);
        gap: 18px;
        height: calc(100vh - 86px);
        padding-top: 18px;
      }

      .window {
        min-height: 0;
        border-radius: 8px;
        padding: 18px;
      }

      .title {
        height: 15px;
        width: 46%;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
      }

      .line {
        height: 10px;
        margin-top: 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.11);
      }

      .line.short {
        width: 68%;
      }

      .dock {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 46px;
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.58);
        font-size: 13px;
      }

      .lexi-layer {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 20;
        width: min(460px, calc(100vw - 28px));
        transform: translateX(-50%);
        transition:
          width 180ms ease,
          bottom 180ms ease;
      }

      .lexi-card {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        min-height: 96px;
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(22px) saturate(1.25);
      }

      .avatar {
        position: relative;
        width: 72px;
        height: 72px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        background: #1e212a;
      }

      .avatar img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .avatar::after {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 13px;
        height: 13px;
        border: 2px solid var(--panel-strong);
        border-radius: 999px;
        background: var(--accent);
        content: "";
      }

      .copy {
        min-width: 0;
      }

      .name {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 5px;
        font-size: 15px;
        font-weight: 700;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        height: 18px;
        padding: 0 7px;
        border: 1px solid rgba(101, 214, 200, 0.42);
        border-radius: 999px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 600;
      }

      .message {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      button {
        display: inline-grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        cursor: pointer;
        font: inherit;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.13);
      }

      .mic {
        border-color: rgba(242, 179, 94, 0.35);
        color: var(--hot);
      }

      .expanded {
        bottom: 32px;
        width: min(560px, calc(100vw - 28px));
      }

      .expanded .lexi-card {
        grid-template-columns: 84px minmax(0, 1fr) auto;
        min-height: 136px;
        background: var(--panel-strong);
      }

      .expanded .avatar {
        width: 84px;
        height: 84px;
      }

      .transcript {
        display: none;
        margin-top: 9px;
        color: #dfddd7;
        font-size: 14px;
        line-height: 1.4;
      }

      .expanded .transcript {
        display: block;
      }

      .hint {
        position: fixed;
        left: 50%;
        bottom: 142px;
        width: min(460px, calc(100vw - 28px));
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.52);
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 640px) {
        .desktop {
          padding: 12px;
        }

        .workarea {
          grid-template-columns: 1fr;
          height: calc(100vh - 70px);
        }

        .workarea .window:first-child {
          display: none;
        }

        .dock {
          right: 10px;
          bottom: 10px;
          left: 10px;
        }

        .lexi-layer {
          bottom: 16px;
        }

        .lexi-card,
        .expanded .lexi-card {
          grid-template-columns: 64px minmax(0, 1fr) auto;
          gap: 10px;
          min-height: 88px;
          padding: 10px;
        }

        .avatar,
        .expanded .avatar {
          width: 64px;
          height: 64px;
        }

        .actions {
          flex-direction: column;
        }

        button {
          width: 32px;
          height: 32px;
        }

        .hint {
          bottom: 124px;
        }
      }
    </style>
  </head>
  <body>
    <main class="desktop">
      <div class="topbar">
        <span>Workspace preview</span>
        <span>Hyprland / BSPWM desktop underneath</span>
      </div>

      <section class="workarea" aria-hidden="true">
        <div class="window">
          <div class="title"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line short"></div>
        </div>
        <div class="window">
          <div class="title"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line short"></div>
        </div>
      </section>

      <div class="dock">Existing panel / dock stays behind the Lexi overlay</div>

      <p class="hint">Click the mic to simulate saying "Hey Lexi".</p>

      <section class="lexi-layer" id="lexiLayer" aria-label="Lexi bottom popup preview">
        <div class="lexi-card">
          <div class="avatar" aria-label="Lexi photo">
            <img src="../assets/Q19WSHi0PH.svg" alt="">
          </div>
          <div class="copy">
            <div class="name">
              <span>Lexi</span>
              <span class="pill">listening</span>
            </div>
            <div class="message">Bottom-center layer-shell style popup.</div>
            <div class="transcript">"Hey Lexi" opens this lightweight overlay without tiling like a normal window.</div>
          </div>
          <div class="actions">
            <button class="mic" id="micButton" type="button" title="Simulate Hey Lexi">●</button>
            <button id="closeButton" type="button" title="Collapse">×</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const layer = document.getElementById("lexiLayer");
      const mic = document.getElementById("micButton");
      const close = document.getElementById("closeButton");

      mic.addEventListener("click", () => {
        layer.classList.add("expanded");
      });

      close.addEventListener("click", () => {
        layer.classList.remove("expanded");
      });
    </script>
  </body>
</html>
