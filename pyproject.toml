[project]
name = "nixii"
version = "0.1.1"
description = "Local voice-command assistant for Linux"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiohttp==3.14.3",
  "ddgs>=9.14.4",
  "faster-whisper==1.2.1",
  "google-genai>=2.16.0",
  "numpy==2.5.1",
  "rich>=15.0.0",
  "sarvamai>=0.1.31",
  "tenacity>=9.1.4",
]

[project.scripts]
nixii-popup = "app.popup.launcher:main"
nixii-server = "app.server.main:main"
nixii-voice = "app.voice.main:main"
nixii-approve = "app.server.approve_cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
